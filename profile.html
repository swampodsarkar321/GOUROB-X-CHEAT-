<body><div class="app">

<div class="flex items-center gap-2"><img src="IMG-20260805-WA0005.jpg" alt="GOUROB X CHEAT" class="w-9 h-9 rounded-full object-cover border border-red-500/60"><div class="text-[13px] font-extrabold tracking-wide">GOUROB <span class="text-red-500">X</span> CHEAT</div></div>

<h2 id="pname" class="font-extrabold mt-1">Loading…</h2>
<p id="pemail" class="text-[11px] text-slate-400"></p>
<div class="flex justify-center gap-2 mt-2 text-[11px]"><span id="puid" class="bg-green-500/15 border border-green-500/40 text-green-300 px-2.5 py-1 rounded-full"></span><span id="pjoined" class="bg-white/5 border border-white/15 px-2.5 py-1 rounded-full"></span></div>
<div class="mt-3 bg-black/40 rounded-xl p-3 flex justify-between items-center text-[13px]"><span><i class="fa-solid fa-wallet text-green-300"></i> Balance: <b>৳ <span class="wallet-amt">0.00</span></b></span><a href="add-fund.html" class="bg-green-500/20 border border-green-500/50 text-green-300 px-3 py-1 rounded-lg text-[12px] font-bold">+ Add Fund</a></div>
</div>
<div class="glass p-4">
<h3 class="text-cyan-300 font-bold text-[13px] mb-3"><i class="fa-solid fa-user"></i> ACCOUNT DETAILS</h3>
<label class="text-[10px] text-slate-400 font-bold">FULL NAME</label><input id="fname" class="field mt-1 mb-3" value="">
<label class="text-[10px] text-slate-400 font-bold">EMAIL (login ID — cannot be changed)</label><input id="femail" class="field mt-1 mb-3" value="" disabled style="opacity:.6">
<label class="text-[10px] text-slate-400 font-bold">PHONE NUMBER</label><input id="fphone" class="field mt-1 mb-3" value="">
<label class="text-[10px] text-slate-400 font-bold">NEW PASSWORD (min 6 — leave blank to keep current)</label><input id="fpass" type="password" class="field mt-1" placeholder="••••••••">
<button onclick="saveProfile()" class="w-full mt-3 bg-cyan-400 text-black font-bold py-2.5 rounded-xl text-[13px]">SAVE CHANGES</button>
<div id="pmsg" class="text-center text-[11px] mt-2"></div>
<button onclick="doLogout()" class="w-full mt-2 text-[12px] text-red-400 py-2">Logout</button>
</div></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="user.js"></script>
<script>
let me=null, myData={};
needAuth(async u=>{
 me=u;
 document.getElementById('pname').textContent=u.displayName||'User';
 document.getElementById('avatar').textContent=(u.displayName||u.email||'?')[0].toUpperCase();
 document.getElementById('pemail').textContent=u.email;
 document.getElementById('femail').value=u.email;
 document.getElementById('puid').textContent='UID: '+u.uid.slice(0,8);
 document.getElementById('pjoined').textContent='Joined '+new Date(parseInt(u.metadata.createdAt)).toLocaleDateString();
 try{ const s=await fbDB().ref('users/'+u.uid).once('value'); myData=s.val()||{};
  document.getElementById('fname').value=myData.name||u.displayName||'';
  document.getElementById('fphone').value=myData.phone||'';
  if(myData.name) document.getElementById('pname').textContent=myData.name;
 }catch(e){}
 paintWallets();
});
async function saveProfile(){
 const m=document.getElementById('pmsg');
 const name=document.getElementById('fname').value.trim(), phone=document.getElementById('fphone').value.trim(), np=document.getElementById('fpass').value;
 if(!name){m.innerHTML='<span class="text-red-400">Enter name</span>';return}
 m.textContent='Saving…';
 try{
  await fbDB().ref('users/'+me.uid).update({name,phone,email:me.email});
  if(name!==me.displayName) await me.updateProfile({displayName:name});
  if(np){ if(np.length<6){m.innerHTML='<span class="text-red-400">Password min 6</span>';return} await me.updatePassword(np); document.getElementById('fpass').value=''; }
  document.getElementById('pname').textContent=name;
  m.innerHTML='<span class="text-green-400"><i class="fa-solid fa-circle-check"></i> Saved</span>';
 }catch(e){m.innerHTML='<span class="text-red-400">'+e.message+'</span>'}
}
</script></body></html>
