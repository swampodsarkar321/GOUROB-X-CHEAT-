<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Orders | GOUROB X CHEAT</title><link rel="icon" type="image/jpeg" href="IMG-20260805-WA0005.jpg"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script></head><body style="background:#04060a;color:#fff" class="p-4"><div class="max-w-3xl mx-auto"><a href="dashboard.html" class="text-xs text-cyan-300"><i class="fa-solid fa-arrow-left"></i> Store</a><h1 class="text-xl font-extrabold mt-2"><i class="fa-solid fa-bolt text-yellow-400"></i> Live Orders</h1><div id="list" class="mt-4 space-y-2 text-sm"><div class="text-slate-400">Loading…</div></div></div><script src="firebase-config.js"></script><script src="user.js"></script><script>
needAuth(()=>{
 fbDB().ref('feed').orderByChild('time').limitToLast(20).on('value',s=>{
  const v=s.val(), l=document.getElementById('list');
  if(!v){l.innerHTML='<div class="text-slate-400">No orders yet.</div>';return}
  l.innerHTML=Object.values(v).reverse().map(o=>{const d=document.createElement('div');return `<div style="background:rgba(15,23,42,.8);border:1px solid rgba(0,240,255,.15);border-radius:12px;padding:12px"><i class="fa-solid fa-circle-check text-green-400"></i> ${o.product||'Product'} — ${o.plan||''} × ${o.qty||1} <span style="color:#64748b">• ${o.time?new Date(o.time).toLocaleString():''}</span></div>`}).join('');
 });
});
</script></body></html>
